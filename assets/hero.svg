<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
<defs>
<linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a4a6e"/><stop offset=".35" stop-color="#05304a"/><stop offset="1" stop-color="#010b14"/></linearGradient>
<linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#40ff73" stop-opacity=".95"/><stop offset=".6" stop-color="#1af2c0" stop-opacity=".35"/><stop offset="1" stop-color="#1af2c0" stop-opacity="0"/></linearGradient>
<radialGradient id="ray" cx=".5" cy="0" r="1"><stop offset="0" stop-color="#9fe8ff" stop-opacity=".25"/><stop offset="1" stop-color="#9fe8ff" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="caustic"><feTurbulence type="fractalNoise" baseFrequency="0.02 0.05" numOctaves="2" seed="4"><animate attributeName="baseFrequency" values="0.02 0.05;0.025 0.04;0.02 0.05" dur="9s" repeatCount="indefinite"/></feTurbulence><feColorMatrix values="0 0 0 0 0.6  0 0 0 0 0.9  0 0 0 0 1  0 0 0 1.4 -0.6"/></filter>
</defs>
<rect width="1200" height="420" fill="url(#sea)"/>
<rect width="1200" height="140" filter="url(#caustic)" opacity=".35"/>
<path d="M150 0 L60 420 L380 420 Z" fill="url(#ray)" opacity=".5"/><path d="M820 0 L700 420 L1000 420 Z" fill="url(#ray)" opacity=".4"/>
<!-- seabed -->
<path d="M0 395 Q200 375 400 392 T800 388 T1200 392 L1200 420 L0 420 Z" fill="#06121a"/>
<!-- transmitter -->
<g transform="translate(110 250)">
<rect x="-34" y="-20" width="56" height="40" rx="8" fill="#0d2d40" stroke="#5ad8ff" stroke-width="2"/>
<rect x="22" y="-9" width="12" height="18" rx="3" fill="#40ff73" filter="url(#glow)"/>
<text x="-6" y="44" font-family="Segoe UI, Helvetica, Arial" font-size="13" fill="#bfefff" text-anchor="middle">520 nm laser</text>
</g>
<!-- beam cone -->
<path d="M146 250 L1060 214 L1060 286 Z" fill="url(#beam)" opacity=".6"/>
<line x1="146" y1="250" x2="1060" y2="250" stroke="#40ff73" stroke-width="2.5" filter="url(#glow)" opacity=".9"/>
<!-- scattered photons: zigzag paths -->
<g fill="none" stroke-width="1.6" stroke-linecap="round" filter="url(#glow)">
<path d="M146 250 L330 246 L420 214 L600 190 L760 232 L1060 248" stroke="#1af2c0" stroke-dasharray="30 1400"><animate attributeName="stroke-dashoffset" values="0;-1000" dur="3.2s" repeatCount="indefinite"/></path>
<path d="M146 250 L260 254 L380 300 L520 312 L700 280 L880 300" stroke="#ffd940" stroke-dasharray="30 1400"><animate attributeName="stroke-dashoffset" values="0;-900" dur="3.6s" begin=".6s" repeatCount="indefinite"/></path>
<path d="M146 250 L470 248 L560 280 L640 230 L820 180 L940 140" stroke="#ff7359" stroke-dasharray="30 1400"><animate attributeName="stroke-dashoffset" values="0;-950" dur="3.9s" begin="1.2s" repeatCount="indefinite"/></path>
<path d="M146 250 L620 252 L700 262 L1060 254" stroke="#40ff73" stroke-dasharray="40 1400"><animate attributeName="stroke-dashoffset" values="0;-950" dur="2.6s" begin=".3s" repeatCount="indefinite"/></path>
<path d="M146 250 L360 252 L430 230 L540 170 L590 120" stroke="#5ad8ff" stroke-dasharray="30 1400"><animate attributeName="stroke-dashoffset" values="0;-600" dur="3s" begin="1.8s" repeatCount="indefinite"/></path>
</g>
<!-- particles -->
<g fill="#bfefff" opacity=".55">
<circle cx="330" cy="246" r="2.2"/><circle cx="420" cy="214" r="1.8"/><circle cx="600" cy="190" r="2"/><circle cx="760" cy="232" r="2.2"/><circle cx="380" cy="300" r="1.8"/><circle cx="520" cy="312" r="2"/><circle cx="700" cy="280" r="1.6"/><circle cx="560" cy="280" r="2"/><circle cx="640" cy="230" r="1.6"/><circle cx="430" cy="230" r="1.8"/><circle cx="540" cy="170" r="2"/><circle cx="700" cy="262" r="1.8"/>
<circle cx="250" cy="330" r="1.4"><animate attributeName="cy" values="330;300;330" dur="7s" repeatCount="indefinite"/></circle>
<circle cx="880" cy="160" r="1.4"><animate attributeName="cy" values="160;130;160" dur="8s" repeatCount="indefinite"/></circle>
</g>
<!-- receiver -->
<g transform="translate(1090 250)">
<rect x="-30" y="-26" width="64" height="52" rx="10" fill="#0d2d40" stroke="#5ad8ff" stroke-width="2"/>
<circle cx="-30" cy="0" r="16" fill="#123b52" stroke="#bfefff" stroke-width="2"/>
<text x="0" y="48" font-family="Segoe UI, Helvetica, Arial" font-size="13" fill="#bfefff" text-anchor="middle">5 cm lens</text>
</g>
<!-- bubbles -->
<g fill="none" stroke="#bfefff" stroke-width="1.2" opacity=".6">
<circle cx="980" cy="400" r="4"><animate attributeName="cy" values="400;-10" dur="7s" repeatCount="indefinite"/></circle>
<circle cx="992" cy="410" r="2.5"><animate attributeName="cy" values="410;-10" dur="6s" begin="1s" repeatCount="indefinite"/></circle>
<circle cx="70" cy="410" r="3"><animate attributeName="cy" values="410;-10" dur="8s" begin="2s" repeatCount="indefinite"/></circle>
</g>
<text x="40" y="66" font-family="Segoe UI, Helvetica, Arial" font-size="40" font-weight="800" fill="#e0f7ff">Light under water</text>
<text x="42" y="100" font-family="Segoe UI, Helvetica, Arial" font-size="18" fill="#40ff73">Monte Carlo photon tracing through four kinds of sea</text>
<text x="42" y="128" font-family="Consolas, monospace" font-size="14" fill="#80aebf">absorption · Henyey-Greenstein scattering · impulse response · BER · reach</text>
</svg>
